[build-system]
requires = ["setuptools>=65.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pecs_pro"
version = "0.1.0"
description = "PECS-PRO workspace continuity cache and daemon"
authors = [
  {name = "PECS-PRO"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "watchdog>=3.0.0,<4.0.0",
]

[project.urls]
Home = "https://example.com/pecs_pro"

[project.scripts]
pecs = "workspace_bridge_cli:main"
pecs-pro = "workspace_bridge_cli:main"
pecs-pro-daemon = "run_pecs_daemon:main"
pecs-pro-install-workspace = "install_workspace_integration:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["pecs_pro", "continuity*", "execution_graph*", "exports*", "integrations*", "runtime*", "topology*", "validation*", "workspace_assets*"]}}
py-modules = [
  "append_ai_chat_history",
  "install_workspace_integration",
  "run_pecs_daemon",
  "run_pecs_lite_v2_daemon",
  "run_pecs_pro",
  "workspace_assets_manager",
  "workspace_bridge_cli",
]
include-package-data = true

[tool.setuptools.package-data]
"" = [
  "workspace_assets/**/*",
  "workspace_assets/**/.github/*",
  "workspace_assets/**/.continue/*",
  "workspace_assets/**/.pecs/*",
  "workspace_assets/workspace_assets_manifest.json",
]
pecs_pro = [
  "workspace_assets/**/*",
  "workspace_assets/**/.github/*",
  "workspace_assets/**/.continue/*",
  "workspace_assets/**/.pecs/*",
  "workspace_assets/workspace_assets_manifest.json",
]
